<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Симулятор Інтерфейсу Бази Даних</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    /* Custom subtle animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">
  <!-- Root React Container -->
  <div id="root" class="min-h-screen flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SVG Icon Components ---
    const IconDatabase = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path>
      </svg>
    );

    const IconLayout = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h3a1 1 0 011 1v6a1 1 0 01-1 1h-3a1 1 0 01-1-1v-6z"></path>
      </svg>
    );

    const IconPlay = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    );

    const IconCheckCircle = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    );

    const IconXCircle = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    );

    const IconLock = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
      </svg>
    );

    const IconPlus = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path>
      </svg>
    );

    const IconTrash = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
      </svg>
    );

    const IconSearch = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
    );

    const IconFilter = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
      </svg>
    );

    const IconCode = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
      </svg>
    );

    const IconSparkles = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
      </svg>
    );

    const IconShield = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
      </svg>
    );

    const IconInfo = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    );

    const IconRefresh = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
      </svg>
    );

    // --- PRESET SCENARIOS ---
    const SCENARIOS = {
      library: {
        id: 'library',
        name: '📚 Шкільна Бібліотека',
        tableName: 'Books',
        columns: [
          { key: 'id', name: 'ID', type: 'number' },
          { key: 'title', name: 'Назва книги', type: 'string' },
          { key: 'author', name: 'Автор', type: 'string' },
          { key: 'genre', name: 'Жанр', type: 'category' },
          { key: 'year', name: 'Рік видання', type: 'number' },
          { key: 'available', name: 'В наявності', type: 'boolean' }
        ],
        genres: ['Фантастика', 'Класика', 'Підручник', 'Пригоди', 'Детектив'],
        initialData: [
          { id: 101, title: 'Кобзар', author: 'Тарас Шевченко', genre: 'Класика', year: 1840, available: true },
          { id: 102, title: 'Тіні забутих предків', author: 'Михайло Коцюбинський', genre: 'Класика', year: 1911, available: true },
          { id: 103, title: 'Місто', author: 'Валер\'ян Підмогильний', genre: 'Класика', year: 1928, available: false },
          { id: 104, title: 'Захар Беркут', author: 'Іван Франко', genre: 'Пригоди', year: 1883, available: true },
          { id: 105, title: 'Інформатика 9 клас', author: 'О. О. Бондаренко', genre: 'Підручник', year: 2022, available: true },
          { id: 106, title: 'Зоряний мандрівник', author: 'Олесь Бердник', genre: 'Фантастика', year: 1971, available: false }
        ]
      },
      journal: {
        id: 'journal',
        name: '🏫 Електронний Журнал',
        tableName: 'Grades',
        columns: [
          { key: 'id', name: 'ID', type: 'number' },
          { key: 'student', name: 'Учень / Учениця', type: 'string' },
          { key: 'subject', name: 'Предмет', type: 'category' },
          { key: 'grade', name: 'Оцінка (1-12)', type: 'number' },
          { key: 'date', name: 'Дата', type: 'string' }
        ],
        subjects: ['Інформатика', 'Математика', 'Фізика', 'Українська мова'],
        initialData: [
          { id: 1, student: 'Коваленко Софія', subject: 'Інформатика', grade: 12, date: '2026-10-01' },
          { id: 2, student: 'Мельник Артем', subject: 'Інформатика', grade: 10, date: '2026-10-01' },
          { id: 3, student: 'Шевченко Богдан', subject: 'Математика', grade: 8, date: '2026-10-02' },
          { id: 4, student: 'Коваленко Софія', subject: 'Фізика', grade: 11, date: '2026-10-03' },
          { id: 5, student: 'Бондар Марія', subject: 'Інформатика', grade: 9, date: '2026-10-04' }
        ]
      }
    };

    // --- AVAILABLE UI COMPONENTS TO BUILD WITH ---
    const AVAILABLE_UI_ELEMENTS = [
      {
        type: 'search',
        name: 'Поле пошуку за назвою/текстом',
        category: 'Пошук і фільтри',
        icon: '🔍',
        defaultProps: { targetColumn: 'title', placeholder: 'Введіть текст для пошуку...' }
      },
      {
        type: 'category_filter',
        name: 'Випадаючий фільтр (Жанр / Предмет)',
        category: 'Пошук і фільтри',
        icon: '🗂️',
        defaultProps: { targetColumn: 'genre' }
      },
      {
        type: 'add_form',
        name: 'Форма додавання нових записів',
        category: 'Форми та дії',
        icon: '➕',
        defaultProps: {
          requireYearValidation: true,
          minYear: 1900,
          maxYear: 2026,
          requiredRoles: ['admin', 'librarian', 'teacher']
        }
      },
      {
        type: 'role_switcher',
        name: 'Перемикач ролей користувачів',
        category: 'Права доступу',
        icon: '🛡️',
        defaultProps: { defaultRole: 'guest' }
      },
      {
        type: 'report_stat',
        name: 'Панель швидкої аналітики / Звіт',
        category: 'Аналітика',
        icon: '📊',
        defaultProps: { statType: 'total_count' }
      }
    ];

    // --- EDUCATIONAL CHALLENGES (МІСІЇ) ---
    const CHALLENGES = [
      {
        id: 'c1',
        title: 'Місія 1: Пошуковий функціонал',
        description: 'Додайте на панель інтерфейсу «Поле пошуку», щоб користувачі могли відбирати потрібні записи за назвою книги чи іменем.',
        check: (elements) => elements.some(el => el.type === 'search'),
        hint: 'Перетягніть або натисніть «+ Додати» біля компонента «Поле пошуку» у списку зліва.'
      },
      {
        id: 'c2',
        title: 'Місія 2: Фільтрація за категорією',
        description: 'Додайте «Випадаючий фільтр», щоб дозволити відбирати дані за категорією (наприклад, Жанр чи Предмет).',
        check: (elements) => elements.some(el => el.type === 'category_filter'),
        hint: 'Додайте компонент «Випадаючий фільтр» у ваш інтерфейс.'
      },
      {
        id: 'c3',
        title: 'Місія 3: Безпека та права доступу',
        description: 'Додайте компонент «Перемикач ролей користувачів» та «Форму додавання записів», щоб продемонструвати як система обмежує редагування для звичайних гостей.',
        check: (elements) => elements.some(el => el.type === 'role_switcher') && elements.some(el => el.type === 'add_form'),
        hint: 'Додайте і Перемикач ролей, і Форму додавання.'
      },
      {
        id: 'c4',
        title: 'Місія 4: Аналітика та звіти',
        description: 'Додайте «Панель швидкої аналітики / Звіт» для автоматичного підрахунку кількості записів у базі даних.',
        check: (elements) => elements.some(el => el.type === 'report_stat'),
        hint: 'Додайте компонент «Панель швидкої аналітики».'
      }
    ];

    function App() {
      // Current active scenario
      const [scenarioKey, setScenarioKey] = useState('library');
      const activeScenario = SCENARIOS[scenarioKey];

      // Interactive UI Layout setup
      const [builtElements, setBuiltElements] = useState([
        { id: 'el-1', type: 'search', targetColumn: activeScenario.columns[1].key, placeholder: 'Шукати...' },
        { id: 'el-2', type: 'role_switcher', defaultRole: 'admin' }
      ]);

      // State during Testing Mode (Interactive Sandbox)
      const [activeTab, setActiveTab] = useState('builder'); // 'builder', 'sandbox', 'challenges'
      const [currentRole, setCurrentRole] = useState('admin'); // 'admin', 'guest', 'student'
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [dbRecords, setDbRecords] = useState(activeScenario.initialData);
      const [lastSqlQuery, setLastSqlQuery] = useState(`SELECT * FROM ${activeScenario.tableName};`);
      const [toastMsg, setToastMsg] = useState(null);

      // Form input states for adding a record
      const [newRecordData, setNewRecordData] = useState({ title: '', author: '', genre: 'Класика', year: '2023' });
      const [formError, setFormError] = useState('');

      // Completed challenges
      const [completedChallenges, setCompletedChallenges] = useState([]);

      // Reset data when scenario changes
      useEffect(() => {
        setDbRecords(activeScenario.initialData);
        setSearchQuery('');
        setSelectedCategory('ALL');
        // adjust default built element search target
        setBuiltElements([
          { id: 'el-1', type: 'search', targetColumn: activeScenario.columns[1].key, placeholder: 'Введіть для пошуку...' },
          { id: 'el-2', type: 'role_switcher', defaultRole: 'admin' }
        ]);
      }, [scenarioKey]);

      // Notification handler
      const showToast = (msg, type = 'info') => {
        setToastMsg({ msg, type });
        setTimeout(() => setToastMsg(null), 3500);
      };

      // Check challenges completion automatically
      useEffect(() => {
        CHALLENGES.forEach(ch => {
          if (!completedChallenges.includes(ch.id) && ch.check(builtElements)) {
            setCompletedChallenges(prev => [...prev, ch.id]);
            showToast(`🎉 Ви виконали: ${ch.title}`, 'success');
          }
        });
      }, [builtElements]);

      // Add UI element to custom builder layout
      const addElementToLayout = (item) => {
        const newEl = {
          id: `el-${Date.now()}-${Math.floor(Math.random()*1000)}`,
          type: item.type,
          ...item.defaultProps
        };
        // Update target column if category filter
        if (item.type === 'category_filter') {
          newEl.targetColumn = scenarioKey === 'library' ? 'genre' : 'subject';
        } else if (item.type === 'search') {
          newEl.targetColumn = scenarioKey === 'library' ? 'title' : 'student';
        }
        setBuiltElements(prev => [...prev, newEl]);
        showToast(`Додано елемент: ${item.name}`, 'info');
      };

      // Remove UI element
      const removeElementFromLayout = (id) => {
        setBuiltElements(prev => prev.filter(el => el.id !== id));
      };

      // Simulated SQL query builder generator
      useEffect(() => {
        let sql = `SELECT * FROM ${activeScenario.tableName}`;
        const conditions = [];

        if (searchQuery.trim()) {
          const searchCol = builtElements.find(e => e.type === 'search')?.targetColumn || 'title';
          conditions.push(`${searchCol} LIKE '%${searchQuery.trim()}%'`);
        }

        if (selectedCategory && selectedCategory !== 'ALL') {
          const catCol = builtElements.find(e => e.type === 'category_filter')?.targetColumn || (scenarioKey === 'library' ? 'genre' : 'subject');
          conditions.push(`${catCol} = '${selectedCategory}'`);
        }

        if (conditions.length > 0) {
          sql += ` WHERE ` + conditions.join(' AND ');
        }

        sql += `;`;
        setLastSqlQuery(sql);
      }, [searchQuery, selectedCategory, builtElements, scenarioKey, activeScenario]);

      // Filtered records in live sandbox view
      const filteredRecords = useMemo(() => {
        return dbRecords.filter(rec => {
          let matchesSearch = true;
          let matchesCat = true;

          const searchElement = builtElements.find(e => e.type === 'search');
          if (searchElement && searchQuery.trim()) {
            const col = searchElement.targetColumn || (scenarioKey === 'library' ? 'title' : 'student');
            const val = String(rec[col] || '').toLowerCase();
            matchesSearch = val.includes(searchQuery.toLowerCase());
          }

          const catElement = builtElements.find(e => e.type === 'category_filter');
          if (catElement && selectedCategory !== 'ALL') {
            const col = catElement.targetColumn || (scenarioKey === 'library' ? 'genre' : 'subject');
            matchesCat = rec[col] === selectedCategory;
          }

          return matchesSearch && matchesCat;
        });
      }, [dbRecords, searchQuery, selectedCategory, builtElements, scenarioKey]);

      // Handle Adding new record with validation
      const handleAddRecord = (e) => {
        e.preventDefault();
        setFormError('');

        // Access control validation
        if (currentRole === 'guest' || currentRole === 'student') {
          setFormError('⛔ Помилка доступу: Роль «Гість» або «Учень» не має прав запису до БД!');
          return;
        }

        if (!newRecordData.title || !newRecordData.author) {
          setFormError('Будь ласка, заповніть усі необхідні текстові поля!');
          return;
        }

        const yearNum = parseInt(newRecordData.year, 10);
        if (isNaN(yearNum) || yearNum < 1800 || yearNum > 2026) {
          setFormError('⚠️ Помилка перевірки коректності даних: Рік видання повинен бути в межах 1800–2026!');
          return;
        }

        const newEntry = {
          id: Date.now(),
          title: newRecordData.title,
          author: newRecordData.author,
          genre: newRecordData.genre || 'Класика',
          year: yearNum,
          available: true,
          student: newRecordData.title,
          subject: newRecordData.genre || 'Інформатика',
          grade: Math.min(12, Math.max(1, yearNum % 12 || 12)),
          date: '2026-10-05'
        };

        setDbRecords(prev => [newEntry, ...prev]);
        setNewRecordData({ title: '', author: '', genre: 'Класика', year: '2023' });
        showToast('✅ Новий запис успішно додано в базу даних!', 'success');
      };

      // Handle Delete Record with Access Validation
      const handleDeleteRecord = (id) => {
        if (currentRole === 'guest' || currentRole === 'student') {
          showToast('⛔ Помилка доступу: Недостатньо прав для видалення записів з БД!', 'error');
          return;
        }

        setDbRecords(prev => prev.filter(r => r.id !== id));
        showToast('🗑️ Запис видалено з бази даних', 'info');
      };

      return (
        <div className="flex-1 flex flex-col font-sans">
          {/* Header Bar */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md bg-opacity-90">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-indigo-600/20 border border-indigo-500/30 rounded-xl text-indigo-400">
                  <IconDatabase />
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                    Конструктор Інтерфейсів Бази Даних
                    <span className="text-xs font-normal px-2 py-0.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full">
                      9 клас
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400">Інтерактивна навчальна симуляція створення та тестування UI для БД</p>
                </div>
              </div>

              {/* Mode Navigation Tabs */}
              <div className="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs sm:text-sm font-medium">
                <button
                  onClick={() => setActiveTab('builder')}
                  className={`px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition ${
                    activeTab === 'builder'
                      ? 'bg-indigo-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <IconLayout />
                  <span>Конструктор (Builder)</span>
                </button>
                <button
                  onClick={() => setActiveTab('sandbox')}
                  className={`px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition relative ${
                    activeTab === 'sandbox'
                      ? 'bg-indigo-600 text-white shadow-md'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <IconPlay />
                  <span>Тестування (Sandbox)</span>

                    </div>
                  </div>

                  <div className="space-y-4 pt-2">
                    {CHALLENGES.map((ch, idx) => {
                      const isDone = completedChallenges.includes(ch.id);
                      return (
                        <div
                          key={ch.id}
                          className={`p-5 rounded-2xl border transition flex flex-col sm:flex-row sm:items-center justify-between gap-4 ${
                            isDone
                              ? 'bg-emerald-950/20 border-emerald-500/30'
                              : 'bg-slate-950 border-slate-800'
                          }`}
                        >
                          <div className="space-y-1">
                            <div className="flex items-center gap-2">
                              <span className={`text-xs font-bold px-2 py-0.5 rounded-md ${
                                isDone ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'
                              }`}>
                                Крок #{idx + 1}
                              </span>
                              <h3 className="text-sm font-bold text-white">{ch.title}</h3>
                            </div>
                            <p className="text-xs text-slate-300 leading-relaxed">{ch.description}</p>
                            <p className="text-[11px] text-indigo-400 flex items-center gap-1 pt-1">
                              💡 <span className="font-semibold">Підказка:</span> {ch.hint}
                            </p>
                          </div>

                          <div className="shrink-0 self-start sm:self-center">
                            {isDone ? (
                              <div className="px-3 py-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold rounded-xl flex items-center gap-1.5">
                                <IconCheckCircle /> Виконано
                              </div>
                            ) : (
                              <button
                                onClick={() => setActiveTab('builder')}
                                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition"
                              >
                                Перейти в конструктор
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
