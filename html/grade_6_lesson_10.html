              <div class="text-[10px] text-slate-500">${slide.category}</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-[10px] text-slate-500"></i>
        </button>
      `).join('');
    }

    // Render Dots
    function renderDots() {
      const container = document.getElementById('dots-container');
      container.innerHTML = slidesData.map((_, idx) => `
        <button onclick="jumpToSlide(${idx + 1})" class="w-2.5 h-2.5 rounded-full transition-all ${idx === currentSlideIndex ? 'bg-blue-500 w-6' : 'bg-slate-700 hover:bg-slate-600'}"></button>
      `).join('');
    }

    // Load Slide Content
    function loadSlide(index) {
      if (index < 0 || index >= slidesData.length) return;

      currentSlideIndex = index;
      const viewport = document.getElementById('slide-viewport');

      // Update Controls
      document.getElementById('current-slide-num').innerText = index + 1;
      document.getElementById('total-slides-num').innerText = slidesData.length;
      document.getElementById('prev-btn').disabled = (index === 0);
      document.getElementById('next-btn').disabled = (index === slidesData.length - 1);

      // Render Content
      viewport.innerHTML = slidesData[index].render();

      renderDrawerList();
      renderDots();

      // Slide-specific initialization
      if (slidesData[index].id === 6) {
        initSortingGame();
      } else if (slidesData[index].id === 7) {
        initQuiz();
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) loadSlide(currentSlideIndex - 1);
    }

    function nextSlide() {
      if (currentSlideIndex < slidesData.length - 1) loadSlide(currentSlideIndex + 1);
    }

    function jumpToSlide(slideId) {
      const targetIdx = slidesData.findIndex(s => s.id === slideId);
      if (targetIdx !== -1) {
        loadSlide(targetIdx);
        toggleSlideDrawer(false);
      }
    }

    function toggleSlideDrawer(forceState) {
      const drawer = document.getElementById('slide-drawer');
      if (forceState !== undefined) {
        if (forceState) drawer.classList.remove('-translate-x-full');
        else drawer.classList.add('-translate-x-full');
      } else {
        drawer.classList.toggle('-translate-x-full');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    /* --- SORTING GAME LOGIC --- */
    function initSortingGame() {
      currentSortingState = JSON.parse(JSON.stringify(initialSortingItems));
      selectedSortingItem = null;
      renderSortingGame();
    }

    function resetSortingGame() {
      initSortingGame();
      document.getElementById('sorting-feedback').innerText = 'Гра скинута. Оберіть програму зі списку.';
      document.getElementById('sorting-feedback').className = 'text-slate-300 font-medium';
    }

    function renderSortingGame() {
      const pool = document.getElementById('items-pool');
      const boxCommercial = document.getElementById('box-commercial');
      const boxFreeware = document.getElementById('box-freeware');
      const boxShareware = document.getElementById('box-shareware');
      const boxOpenSource = document.getElementById('box-opensource');

      if (!pool) return;

      pool.innerHTML = '';
      boxCommercial.innerHTML = '';
      boxFreeware.innerHTML = '';
      boxShareware.innerHTML = '';
      boxOpenSource.innerHTML = '';

      currentSortingState.forEach(item => {
        const isSelected = selectedSortingItem === item.id;
        const itemEl = document.createElement('div');
        itemEl.className = `px-3 py-1.5 rounded-lg border text-xs font-semibold cursor-pointer transition flex items-center gap-1.5 ${
          isSelected 
            ? 'bg-blue-600 text-white border-blue-400 ring-2 ring-blue-400/50 scale-105' 
            : 'bg-slate-700 hover:bg-slate-600 text-slate-200 border-slate-600'
        }`;
        itemEl.innerHTML = `<i class="fa-solid fa-cube text-[10px] text-blue-400"></i> ${item.name}`;
        itemEl.onclick = (e) => {
          e.stopPropagation();
          selectSortingItem(item.id);
        };

        if (!item.currentBox) {
          pool.appendChild(itemEl);
        } else {
          const targetBox = document.getElementById(`box-${item.currentBox}`);
          if (targetBox) targetBox.appendChild(itemEl);
        }
      });
    }

    function selectSortingItem(id) {
      selectedSortingItem = (selectedSortingItem === id) ? null : id;
      renderSortingGame();
      const feedback = document.getElementById('sorting-feedback');
      if (selectedSortingItem) {
        const item = currentSortingState.find(i => i.id === selectedSortingItem);
        feedback.innerText = `Обрано: "${item.name}". Тепер клацніть на блок категорії для розподілу.`;
        feedback.className = 'text-blue-300 font-semibold';
      } else {
        feedback.innerText = 'Оберіть програму зі списку.';
        feedback.className = 'text-slate-300 font-medium';
      }
    }

    function assignSelectedTo(categoryKey) {
      if (!selectedSortingItem) return;
      const item = currentSortingState.find(i => i.id === selectedSortingItem);
      if (item) {
        item.currentBox = categoryKey;
        selectedSortingItem = null;
        renderSortingGame();
        document.getElementById('sorting-feedback').innerText = `Програму "${item.name}" переміщено.`;
        document.getElementById('sorting-feedback').className = 'text-emerald-300 font-medium';
      }
    }

    function checkSortingGame() {
      let unassigned = currentSortingState.filter(i => !i.currentBox);
      if (unassigned.length > 0) {
        document.getElementById('sorting-feedback').innerText = `Будь ласка, розподіліть всі 8 програм за категоріями!`;
        document.getElementById('sorting-feedback').className = 'text-amber-400 font-bold';
        return;
      }

      let correctCount = 0;
      currentSortingState.forEach(i => {
        if (i.currentBox === i.category) correctCount++;
      });

      const feedback = document.getElementById('sorting-feedback');
      if (correctCount === currentSortingState.length) {
        feedback.innerText = `Чудово! Всі ${correctCount} із 8 програм розподілено абсолютно правильно! 🎉`;
        feedback.className = 'text-emerald-400 font-bold text-sm';
        confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
      } else {
        feedback.innerText = `Результат: ${correctCount} із 8 правильних. Спробуйте ще раз виправити помилки!`;
        feedback.className = 'text-rose-400 font-bold';
      }
    }

    /* --- QUIZ LOGIC --- */
    function initQuiz() {
      currentQuizStep = 0;
      quizScore = 0;
      quizSelectedOption = null;
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const container = document.getElementById('quiz-container');
      const stepBadge = document.getElementById('quiz-current-step');
      const nextBtn = document.getElementById('quiz-next-btn');

      if (!container) return;

      if (currentQuizStep >= quizQuestions.length) {
        // Quiz Complete Screen
        container.innerHTML = `
          <div class="text-center py-6 space-y-4">
            <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-3xl mx-auto font-bold">
              <i class="fa-solid fa-trophy"></i>
            </div>
            <h3 class="text-2xl font-extrabold text-white">Тест успішно завершено!</h3>
            <p class="text-base text-slate-300">
              Ваш результат: <strong class="text-emerald-400 text-xl">${quizScore}</strong> з <strong class="text-white text-xl">${quizQuestions.length}</strong> правильних відповідей.
            </p>
            <div class="pt-2">
              <button onclick="initQuiz()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition">
                <i class="fa-solid fa-rotate-right mr-1.5"></i> Пройти тест знову
              </button>
            </div>
          </div>
        `;
        if (stepBadge) stepBadge.innerText = quizQuestions.length;
        if (nextBtn) nextBtn.style.display = 'none';
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        return;
      }

      if (nextBtn) nextBtn.style.display = 'inline-flex';
      if (stepBadge) stepBadge.innerText = currentQuizStep + 1;

      const q = quizQuestions[currentQuizStep];
      container.innerHTML = `
        <h3 class="text-lg font-bold text-white mb-4 leading-snug">${currentQuizStep + 1}. ${q.question}</h3>
        <div class="space-y-2.5">
          ${q.options.map((opt, idx) => `
            <button onclick="selectQuizOption(${idx})" class="w-full text-left p-3.5 rounded-xl border text-xs font-semibold transition flex items-center justify-between ${
              quizSelectedOption === idx 
                ? 'bg-blue-600 border-blue-400 text-white ring-2 ring-blue-400/40' 
                : 'bg-slate-900/60 border-slate-700 text-slate-200 hover:bg-slate-700/80'
            }">
              <span>${opt}</span>
              <div class="w-5 h-5 rounded-full border ${quizSelectedOption === idx ? 'border-white bg-white text-blue-600' : 'border-slate-500'} flex items-center justify-center text-[10px]">
                ${quizSelectedOption === idx ? '<i class="fa-solid fa-check"></i>' : ''}
              </div>
            </button>
          `).join('')}
        </div>
      `;
    }

    function selectQuizOption(idx) {
      quizSelectedOption = idx;
      renderQuizQuestion();
    }

    function submitQuizAnswer() {
      if (quizSelectedOption === null) {
        alert('Будь ласка, оберіть варіант відповіді!');
        return;
      }

      if (quizSelectedOption === quizQuestions[currentQuizStep].correct) {
        quizScore++;
      }

      currentQuizStep++;
      quizSelectedOption = null;
      renderQuizQuestion();
    }
  </script>
</body>
</html>
